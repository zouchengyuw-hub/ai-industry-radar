name: AI radar cloud summaries
on:
  workflow_dispatch:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
concurrency:
  group: ai-radar-summarizer
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python radar.py summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_W }}
          ENABLE_FREE_AI: ${{ vars.ENABLE_FREE_AI }}
          AI_DAILY_LIMIT: '30'
      - name: Save summaries
        run: |
          if [ -f data/summaries.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              python -c 'import json,subprocess,pathlib; p=pathlib.Path("data/summaries.json"); remote=json.loads(subprocess.check_output(["git","show","FETCH_HEAD:data/summaries.json"],text=True)); local=json.loads(p.read_text()); merged=dict(remote.get("items",{})); merged.update(local.get("items",{})); remote["items"]=merged; remote["quota"]={**remote.get("quota",{}),**local.get("quota",{})}; remote["last_run"]=max([remote.get("last_run",{}),local.get("last_run",{})],key=lambda x:x.get("time","")); p.write_text(json.dumps(remote,ensure_ascii=False,indent=2)+"\n")'
              git add data/summaries.json
              git diff --cached --quiet || git commit -m 'Update summaries'
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            done
            exit 1
          fi
