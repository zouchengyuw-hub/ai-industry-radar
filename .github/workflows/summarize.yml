name: AI radar cloud summaries
on:
  workflow_dispatch:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
concurrency:
  group: ai-radar-summarizer
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python radar.py summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_W }}
          ENABLE_FREE_AI: ${{ vars.ENABLE_FREE_AI }}
          AI_DAILY_LIMIT: '30'
      - name: Save summaries
        run: |
          cp data/summaries.json /tmp/local-summaries.json
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout FETCH_HEAD -- data/summaries.json
            python -c 'import json,pathlib; p=pathlib.Path("data/summaries.json"); remote=json.loads(p.read_text()); local=json.loads(pathlib.Path("/tmp/local-summaries.json").read_text()); remote["items"]={**remote.get("items",{}),**local.get("items",{})}; remote["quota"]={**remote.get("quota",{}),**local.get("quota",{})}; remote["last_run"]=max([remote.get("last_run",{}),local.get("last_run",{})],key=lambda x:x.get("time","")); p.write_text(json.dumps(remote,ensure_ascii=False,indent=2)+"\n")'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/summaries.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update summaries' || true
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; continue; }
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
