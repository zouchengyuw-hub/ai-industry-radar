<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 行业雷达</title><style>body{font:16px system-ui;color:#17233a;background:#f4f7fb;margin:0}main{max-width:1050px;margin:auto;padding:24px}header{position:sticky;top:0;background:#f4f7fb;padding:10px 0;z-index:1}h1{margin:0}.meta,small{color:#5f7185;font-size:13px}input,select{padding:10px;border:1px solid #ccd6e1;border-radius:8px;font-size:15px}article{background:white;border:1px solid #dfe6ef;border-radius:12px;margin:12px 0;padding:18px}h2{font-size:19px;margin:8px 0}li{margin:6px 0}.tag{background:#e8f1fc;color:#23548b;padding:3px 7px;border-radius:5px;margin-right:5px}a{color:#175ba0}.pending{color:#9d600b}</style></head><body><main><header><h1>AI 行业雷达</h1><p class="meta" id="status">加载中…</p><input id="query" placeholder="搜索新闻、公司或主题"><select id="filter"><option value="">全部分类</option></select><p class="meta">发布时间与首次发现时间分别显示；等待或失败的项目尚未获得全文中文摘要。</p></header><div id="content"></div></main><script>
let items=[], summaries={};const content=document.querySelector('#content'),q=document.querySelector('#query'),f=document.querySelector('#filter');
function time(s){if(!s)return '未提供';const d=new Date(s);return Number.isNaN(d.valueOf())?'未提供':d.toLocaleString('zh-CN',{timeZone:'Asia/Dubai',hour12:false})+' 迪拜';}
function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function render(){content.replaceChildren();const query=q.value.toLowerCase(),tag=f.value;for(const item of items){const s=summaries[item.id]||{}, tags=[...(Array.isArray(s.company)?s.company:[]),...(Array.isArray(s.topics)?s.topics:[])];let search=[item.title,s.title_zh,item.source,...tags].join(' ').toLowerCase();if(!search.includes(query)||(tag&&!tags.includes(tag)))continue;const card=node('article'),meta=node('div',item.source+' · 发布 '+time(item.published)+' · 首次发现 '+time(item.first_seen),'meta');card.append(meta,node('h2',s.title_zh||item.title));for(const t of tags)card.append(node('span',t,'tag'));if(Array.isArray(s.summary)&&s.summary.length){const ul=node('ul');for(const line of s.summary)ul.append(node('li',String(line)));card.append(ul,node('small','AI 依据：'+(s.basis||'正文')))}else card.append(node('p',s.error?'未提炼：'+s.error:'等待 AI 提炼','pending'));const link=node('a','原文来源 ↗');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';card.append(link);content.append(card)}}
Promise.all([fetch('data/news.json',{cache:'no-store'}).then(x=>x.ok?x.json():Promise.reject(Error('暂无采集数据'))),fetch('data/summaries.json',{cache:'no-store'}).then(x=>x.ok?x.json():({items:{}})).catch(()=>({items:{}}))]).then(([data,s])=>{items=(data.items||[]).sort((a,b)=>String(b.published||b.first_seen).localeCompare(String(a.published||a.first_seen)));summaries=s.items||{};let completed=items.filter(x=>summaries[x.id]?.summary?.length).length;let errors=items.filter(x=>summaries[x.id]?.error).length;let pending=items.length-completed-errors;let lr=s.last_run;document.querySelector('#status').textContent='最后采集 '+time(data.updated_at)+' · '+items.length+' 条 · 已提炼 '+completed+' · 等待 '+pending+' · 失败 '+errors+' · 来源正常 '+Object.values(data.sources||{}).filter(x=>x.ok).length+'/'+Object.keys(data.sources||{}).length+(lr?' · 上次提炼 '+time(lr.time)+'（'+lr.succeeded+'/'+lr.attempted+'）':'');const tags=new Set();Object.values(summaries).forEach(s=>[...(Array.isArray(s.company)?s.company:[]),...(Array.isArray(s.topics)?s.topics:[])].forEach(t=>tags.add(String(t))));[...tags].sort().forEach(t=>{const o=node('option',t);o.value=t;f.append(o)});render()}).catch(e=>document.querySelector('#status').textContent='无法加载数据：'+e.message+'；请通过网页服务器访问。');q.oninput=render;f.onchange=render;
</script></body></html>
