<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 行业雷达</title><style>body{font:16px system-ui;color:#17233a;background:#f4f7fb;margin:0}main{max-width:1050px;margin:auto;padding:24px}header{position:sticky;top:0;background:#f4f7fb;padding:10px 0;z-index:1}h1{margin:0}.meta,small{color:#5f7185;font-size:13px}input,select{padding:10px;border:1px solid #ccd6e1;border-radius:8px;font-size:15px}article{background:white;border:1px solid #dfe6ef;border-radius:12px;margin:12px 0;padding:18px}h2{font-size:19px;margin:8px 0}li{margin:6px 0}.tag{background:#e8f1fc;color:#23548b;padding:3px 7px;border-radius:5px;margin-right:5px}a{color:#175ba0}.pending{color:#9d600b}</style></head><body><main><header><h1>AI 行业雷达</h1><p class="meta" id="status">加载中…</p><input id="query" placeholder="搜索新闻、公司或主题"><select id="filter"><option value="">全部分类</option></select><p class="meta">发布时间与首次发现时间分别显示；等待或失败的项目尚未获得全文中文摘要。</p></header><div id="content"></div><button id="more" hidden style="display:block;margin:20px auto;padding:12px 20px;border:1px solid #ccd6e1;border-radius:8px;background:white;font-size:15px;cursor:pointer"></button></main><script>
let items=[], summaries={}, pageSize=80, visibleCount=pageSize;const content=document.querySelector('#content'),q=document.querySelector('#query'),f=document.querySelector('#filter'),more=document.querySelector('#more');
function time(s){if(!s)return '未提供';const d=new Date(s);return Number.isNaN(d.valueOf())?'未提供':d.toLocaleString('zh-CN',{timeZone:'Asia/Dubai',hour12:false})+' 迪拜';}
function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function render(){content.replaceChildren();const query=q.value.trim().toLowerCase(),tag=f.value,groups=new Map();for(const x of items){const key=x.published?x.title.trim().toLowerCase()+'|'+x.published:x.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}const matched=[];for(const group of groups.values()){const item=group.find(x=>summaries[x.id]?.summary?.length)||group[0],s=summaries[item.id]||{},tags=[...(Array.isArray(s.company)?s.company:[]),...(Array.isArray(s.topics)?s.topics:[])];if([item.title,s.title_zh,item.source,...tags].join(' ').toLowerCase().includes(query)&&(!tag||tags.includes(tag)))matched.push({group,item,s,tags})}for(const {group,item,s,tags} of matched.slice(0,visibleCount)){const card=node('article'),meta=node('div',item.source+' · 发布 '+time(item.published)+' · 首次发现 '+time(item.first_seen),'meta');card.append(meta,node('h2',s.title_zh||item.title));for(const t of tags)card.append(node('span',t,'tag'));if(Array.isArray(s.summary)&&s.summary.length){const ul=node('ul');for(const line of s.summary)ul.append(node('li',String(line)));card.append(ul,node('small','AI 依据：'+(s.basis||'正文')))}else card.append(node('p',s.error?'未提炼：'+s.error:'等待云端 AI 提炼','pending'));for(const [index,source] of group.entries()){const link=node('a',group.length>1?(index===0?'原文来源 ↗':source.source+' ↗'):'原文来源 ↗');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';if(index)link.style.marginLeft='10px';card.append(link)}if(group.length>1)card.append(node('small','相同标题与发布时间，汇总 '+group.length+' 个来源；摘要依据：'+item.source));content.append(card)}if(more){more.hidden=matched.length<=visibleCount;more.textContent='继续加载（已显示 '+Math.min(visibleCount,matched.length)+' / '+matched.length+'）'}}
Promise.all([fetch('data/news.json',{cache:'no-store'}).then(x=>x.ok?x.json():Promise.reject(Error('暂无采集数据'))),fetch('data/summaries.json',{cache:'no-store'}).then(x=>x.ok?x.json():({items:{}})).catch(()=>({items:{}}))]).then(([data,s])=>{items=(data.items||[]).sort((a,b)=>String(b.published||b.first_seen).localeCompare(String(a.published||a.first_seen)));summaries=s.items||{};const completed=items.filter(x=>summaries[x.id]?.summary?.length).length,errors=items.filter(x=>summaries[x.id]?.error).length,pending=items.length-completed-errors,lr=s.last_run;document.querySelector('#status').textContent='最后采集 '+time(data.updated_at)+' · '+items.length+' 条 · 云端已提炼 '+completed+' · 等待 '+pending+' · 失败 '+errors+' · 来源正常 '+Object.values(data.sources||{}).filter(x=>x.ok).length+'/'+Object.keys(data.sources||{}).length+(lr?' · 上次云端提炼 '+time(lr.time)+'（'+lr.succeeded+'/'+lr.attempted+'）':'');const tags=new Set();Object.values(summaries).forEach(s=>[...(Array.isArray(s.company)?s.company:[]),...(Array.isArray(s.topics)?s.topics:[])].forEach(t=>tags.add(String(t))));[...tags].sort().forEach(t=>{const o=node('option',t);o.value=t;f.append(o)});render()}).catch(e=>document.querySelector('#status').textContent='无法加载数据：'+e.message+'；请通过网页服务器访问。');q.oninput=()=>{visibleCount=pageSize;render()};f.onchange=()=>{visibleCount=pageSize;render()};more.onclick=()=>{visibleCount+=pageSize;render()};
</script></body></html>
